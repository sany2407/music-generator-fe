name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: glassy-archway-437503-h6
  REGION: asia-southeast1
  SERVICE: music-generator-fe
  IMAGE: asia-southeast1-docker.pkg.dev/glassy-archway-437503-h6/music-generator/frontend
  API_URL: https://music-generator-be-45395552066.asia-southeast1.run.app
  WIF_PROVIDER: projects/45395552066/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deployer@glassy-archway-437503-h6.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" .

      - name: Push image
        run: docker push --all-tags "$IMAGE"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
